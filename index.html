<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>1P1J - 1인 1역 배정</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  /* =====================================================================================
     디자인 시스템 — "통통 튀는 교실" 컨셉
     파스텔 베이커리 브랜딩에서 가져온 언어:
       · 화면 전체를 감싸는 초록 프레임
       · 상단 노란 히어로 밴드 + 언덕 일러스트 + 마스코트 캐릭터
       · 두툼한 테두리 + 아래로 떨어지는 단색 그림자 = 장난감 같은 입체감
       · 크게 굴린 모서리, 알약 모양 버튼/칩
     색은 전부 아래 CSS 변수로만 관리한다. 새 색을 하드코딩하지 말 것.
     ===================================================================================== */
  :root {
    /* 메인: 잔디 초록 */
    --green: #62C370;
    --green-dark: #3E9E52;
    --green-soft: #E6F6E7;
    --green-line: #B8E4BE;
    /* 포인트: 버터 노랑 (히어로 밴드) */
    --butter: #FFE79B;
    --butter-soft: #FFF7DB;
    --butter-dark: #E9B93C;
    /* 포인트: 딸기 핑크 */
    --pink: #FF8FB1;
    --pink-dark: #E5628B;
    --pink-soft: #FFE9F0;
    /* 포인트: 하늘 파랑 */
    --sky: #79C6EE;
    --sky-dark: #4A9FCC;
    --sky-soft: #E5F4FC;
    /* 중립 */
    --bg: #F7F6EE;
    --card: #FFFFFF;
    --line: #E8E3D2;
    --line-dark: #D6CFB8;
    --text: #3B3C33;
    --muted: #918D7C;
    /* 상태 */
    --danger: #F26B60;
    --danger-dark: #D24A3F;
    --danger-soft: #FFEAE7;
    --gold: #F3B33D;
    /* 통통 튀는 이징 — 살짝 오버슈트해서 튕기는 느낌을 준다 */
    --boing: cubic-bezier(.34, 1.56, .64, 1);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: var(--bg);
    /* 은은한 도트 패턴 — 종이 위 스티커 같은 바탕 */
    background-image:
      radial-gradient(circle at 50% 50%, rgba(98,195,112,.10) 1.6px, transparent 1.7px),
      radial-gradient(circle at 12% 0%, rgba(255,231,155,.35), transparent 42%);
    background-size: 22px 22px, 100% 100%;
    background-attachment: fixed;
    color: var(--text);
    line-height: 1.65;
    letter-spacing: -0.01em;
  }
  /* 화면을 감싸는 초록 프레임 — 이 앱의 시그니처. 스크롤해도 고정된다. */
  body::after {
    content: ""; position: fixed; inset: 0; z-index: 900; pointer-events: none;
    border: 9px solid var(--green);
  }
  #app { min-height: 100vh; display: flex; flex-direction: column; }
  a { color: var(--green-dark); }
  .brand-font, h1, h2, .hero-title, .stat-box .num, .tab-step {
    font-family: "Jua", "Noto Sans KR", sans-serif; font-weight: 400; letter-spacing: 0;
  }

  /* ------------------------------ 상단바 ------------------------------ */
  header.topbar {
    background: #fff;
    border-bottom: 2px solid var(--line);
    padding: 12px 26px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 50;
  }
  header.topbar .brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  header.topbar .brand-mark {
    width: 36px; height: 36px; border-radius: 13px; flex-shrink: 0;
    background: var(--green);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 0 var(--green-dark);
    transition: transform .25s var(--boing);
  }
  header.topbar .brand:hover .brand-mark { transform: translateY(-2px) rotate(-8deg); }
  header.topbar .brand-mark svg { width: 19px; height: 19px; }
  header.topbar .brand-text {
    font-family: "Jua", "Noto Sans KR", sans-serif; font-size: 23px; color: var(--green-dark);
  }
  header.topbar .user-box { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }

  /* ------------------------------ 히어로 밴드 ------------------------------ */
  /* 노란 하늘 + 초록 언덕 + 마스코트. HeroBand 컴포넌트가 이 마크업을 그린다. */
  .hero {
    position: relative; overflow: hidden;
    background: linear-gradient(180deg, var(--butter-soft) 0%, var(--butter) 100%);
    padding: 30px 20px 78px;
    text-align: center;
    border-bottom: 2px solid var(--line);
  }
  .hero-hills { position: absolute; left: 0; right: 0; bottom: -1px; width: 100%; height: 110px; display: block; }
  .hero-inner { position: relative; z-index: 2; }
  .hero-title { font-size: 38px; margin: 0; color: #4A5A3E; text-shadow: 0 2px 0 rgba(255,255,255,.6); }
  .hero-sub { margin: 4px 0 0; font-size: 14.5px; color: #7E7A5E; font-weight: 500; }
  .hero-actions { margin-top: 14px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  /* 마스코트 — 좁은 화면에서는 자리를 못 잡으니 숨긴다 */
  .hero-char {
    position: absolute; bottom: 14px; z-index: 3; line-height: 1; user-select: none;
    font-size: 52px;
    filter: drop-shadow(0 5px 6px rgba(90,80,40,.2));
    animation: float-y 3.4s ease-in-out infinite;
  }
  .hero-char.left { left: 6%; }
  .hero-char.right { right: 6%; font-size: 58px; animation-delay: .9s; }
  @media (max-width: 900px) { .hero-char { display: none; } }

  /* ------------------------------ 레이아웃 ------------------------------ */
  main.content { flex: 1; padding: 26px 20px 10px; max-width: 1080px; width: 100%; margin: 0 auto; }
  .student-shell main.content { max-width: 520px; padding: 22px 18px 10px; }

  .card {
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 24px;
    padding: 24px;
    margin-bottom: 18px;
    box-shadow: 0 4px 0 var(--line), 0 12px 24px rgba(80,90,60,.05);
    animation: pop-in .4s var(--boing) both;
  }
  .card.tight { padding: 18px 20px; }

  h1 { font-size: 30px; margin: 0 0 12px; color: var(--text); }
  h2 { font-size: 22px; margin: 0 0 12px; color: var(--text); }
  h3 {
    font-size: 15px; margin: 0 0 10px; color: var(--muted); font-weight: 700;
    display: flex; align-items: center; gap: 7px;
  }
  p.hint { color: var(--muted); font-size: 13px; margin: 7px 0 0; line-height: 1.6; }
  .muted { color: var(--muted); }

  /* ------------------------------ 버튼 ------------------------------ */
  /* 아래로 떨어지는 단색 그림자 → 누르면 그림자가 사라지며 내려앉는다 (물리적인 느낌) */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 2px solid var(--line-dark); background: #fff; color: var(--text);
    padding: 9px 18px; border-radius: 999px; font-size: 14px; font-weight: 700; cursor: pointer;
    min-height: 44px; font-family: inherit; white-space: nowrap;
    box-shadow: 0 3px 0 var(--line-dark);
    transition: transform .18s var(--boing), box-shadow .18s var(--boing), background .15s ease;
  }
  .btn:hover { background: var(--green-soft); transform: translateY(-2px); box-shadow: 0 5px 0 var(--line-dark); }
  .btn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--line-dark); }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: 0 3px 0 var(--line-dark); }
  .btn-primary { background: var(--green); border-color: var(--green-dark); color: #fff; box-shadow: 0 3px 0 var(--green-dark); }
  .btn-primary:hover { background: #6FD07D; box-shadow: 0 5px 0 var(--green-dark); }
  .btn-primary:active { box-shadow: 0 0 0 var(--green-dark); }
  .btn-pink { background: var(--pink); border-color: var(--pink-dark); color: #fff; box-shadow: 0 3px 0 var(--pink-dark); }
  .btn-pink:hover { background: #FF9FBD; box-shadow: 0 5px 0 var(--pink-dark); }
  .btn-pink:active { box-shadow: 0 0 0 var(--pink-dark); }
  .btn-danger { color: var(--danger-dark); border-color: #F3BDB6; background: #fff; box-shadow: 0 3px 0 #F3BDB6; }
  .btn-danger:hover { background: var(--danger-soft); box-shadow: 0 5px 0 #F3BDB6; }
  .btn-danger:active { box-shadow: 0 0 0 #F3BDB6; }
  .btn-sm { padding: 5px 13px; min-height: 34px; font-size: 13px; box-shadow: 0 2px 0 var(--line-dark); }
  .btn-sm:hover { transform: translateY(-1px); box-shadow: 0 3px 0 var(--line-dark); }
  .btn-sm.btn-danger { box-shadow: 0 2px 0 #F3BDB6; }
  .btn-sm.btn-danger:hover { box-shadow: 0 3px 0 #F3BDB6; }
  .btn-lg { padding: 15px 24px; min-height: 58px; font-size: 17px; width: 100%; }

  .row { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }
  .row-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

  /* ------------------------------ 입력 ------------------------------ */
  .input, select.input, textarea.input {
    border: 2px solid var(--line); border-radius: 14px; padding: 11px 15px; font-size: 14.5px;
    font-family: inherit; width: 100%; background: #fff; color: var(--text);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .input:focus, select.input:focus, textarea.input:focus {
    outline: none; border-color: var(--green); box-shadow: 0 0 0 4px var(--green-soft);
  }
  .input::placeholder { color: #BFBAA8; }
  textarea.input { resize: vertical; min-height: 96px; line-height: 1.7; }

  /* ------------------------------ 표 ------------------------------ */
  table.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; }
  table.tbl th, table.tbl td { text-align: left; padding: 11px 12px; border-bottom: 2px dotted var(--line); }
  table.tbl th { color: var(--muted); font-weight: 700; font-size: 12.5px; letter-spacing: .02em; }
  table.tbl tr:last-child td { border-bottom: none; }
  table.tbl tbody tr { transition: background .15s ease; }
  table.tbl tbody tr:hover { background: var(--butter-soft); }
  .tbl-wrap { overflow-x: auto; }

  /* ------------------------------ 뱃지 ------------------------------ */
  .badge {
    display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 700;
    border: 2px solid transparent;
  }
  .badge-green { background: var(--green-soft); color: var(--green-dark); border-color: var(--green-line); }
  .badge-gray { background: #F2EFE4; color: var(--muted); border-color: var(--line); }
  .badge-blue { background: var(--sky-soft); color: var(--sky-dark); border-color: #BFE3F5; }
  .badge-red { background: var(--danger-soft); color: var(--danger-dark); border-color: #F8CDC7; }
  .badge-pink { background: var(--pink-soft); color: var(--pink-dark); border-color: #FFC9DA; }
  /* 카드 위에 얹는 리본 뱃지 (레퍼런스의 NEW/BEST 스타일) */
  .ribbon {
    position: absolute; top: 14px; right: 16px; z-index: 2;
    background: var(--pink); color: #fff; font-size: 11.5px;
    padding: 3px 12px; border-radius: 999px; box-shadow: 0 2px 0 var(--pink-dark);
    font-family: "Jua", sans-serif; letter-spacing: .04em;
  }

  /* ------------------------------ 경고 박스 ------------------------------ */
  .warning-box {
    background: var(--butter-soft); border: 2px solid var(--butter); color: #8A6410;
    padding: 15px 18px; border-radius: 18px; font-size: 13.5px; margin-bottom: 16px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    box-shadow: 0 3px 0 var(--butter);
  }

  /* ------------------------------ 탭 (스텝 인디케이터) ------------------------------ */
  .tabs {
    display: flex; gap: 6px; background: #fff; border: 2px solid var(--line);
    border-radius: 999px; padding: 6px; margin-bottom: 22px; overflow-x: auto;
    box-shadow: 0 4px 0 var(--line);
  }
  .tab {
    flex: 1 0 auto; display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 11px 16px; border-radius: 999px; cursor: pointer; white-space: nowrap;
    font-size: 14.5px; font-weight: 700; color: var(--muted);
    transition: all .2s var(--boing);
  }
  .tab .tab-step {
    width: 23px; height: 23px; border-radius: 50%; flex-shrink: 0;
    background: var(--line); color: #fff; font-size: 13px;
    display: flex; align-items: center; justify-content: center; line-height: 1;
    transition: background .2s ease;
  }
  .tab:hover { color: var(--text); background: var(--green-soft); }
  .tab.active { background: var(--green); color: #fff; box-shadow: 0 3px 0 var(--green-dark); transform: translateY(-2px); }
  .tab.active .tab-step { background: rgba(255,255,255,.4); }

  /* ------------------------------ 통계 박스 ------------------------------ */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: 12px; }
  .stat-box {
    background: var(--green-soft); border: 2px solid var(--green-line); border-radius: 20px;
    padding: 16px 12px; text-align: center; box-shadow: 0 3px 0 var(--green-line);
    transition: transform .2s var(--boing);
  }
  .stat-box:hover { transform: translateY(-3px); }
  .stat-box .num { font-size: 32px; line-height: 1.1; color: var(--green-dark); }
  .stat-box .label { font-size: 12.5px; color: var(--muted); margin-top: 3px; font-weight: 700; }
  /* 지망 순위별 색 구분 — 한눈에 읽히도록 */
  .stat-box.s1 { background: var(--butter-soft); border-color: var(--butter); box-shadow: 0 3px 0 var(--butter); }
  .stat-box.s1 .num { color: var(--butter-dark); }
  .stat-box.s2 { background: var(--sky-soft); border-color: #BFE3F5; box-shadow: 0 3px 0 #BFE3F5; }
  .stat-box.s2 .num { color: var(--sky-dark); }
  .stat-box.s3 { background: var(--pink-soft); border-color: #FFC9DA; box-shadow: 0 3px 0 #FFC9DA; }
  .stat-box.s3 .num { color: var(--pink-dark); }
  .stat-box.s0 { background: #F2EFE4; border-color: var(--line); box-shadow: 0 3px 0 var(--line); }
  .stat-box.s0 .num { color: var(--muted); }

  /* ------------------------------ 지망 선택 카드 (학생 화면) ------------------------------ */
  .choice-list { display: flex; flex-direction: column; gap: 10px; }
  .choice-option {
    border: 2px solid var(--line); border-radius: 20px; padding: 14px 18px; background: #fff;
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    cursor: pointer; font-size: 16px; font-weight: 700;
    box-shadow: 0 3px 0 var(--line);
    transition: transform .2s var(--boing), box-shadow .2s var(--boing), border-color .15s, background .15s;
  }
  .choice-option:hover { transform: translateY(-3px) rotate(-.7deg); border-color: var(--green-line); box-shadow: 0 6px 0 var(--green-soft); }
  .choice-option:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
  .choice-option .role-emoji { font-size: 21px; margin-right: 9px; display: inline-block; }
  .choice-option:hover .role-emoji { animation: wiggle .55s ease-in-out; }
  .choice-option .rank-badge {
    font-size: 12px; font-weight: 700; color: #fff; background: var(--muted);
    padding: 4px 12px; border-radius: 999px; flex-shrink: 0;
    animation: pop-in .3s var(--boing) both;
  }
  .choice-option.rank1.selected { border-color: var(--butter-dark); background: var(--butter-soft); box-shadow: 0 4px 0 var(--butter-dark); }
  .choice-option.rank1.selected .rank-badge { background: var(--butter-dark); }
  .choice-option.rank2.selected { border-color: var(--sky-dark); background: var(--sky-soft); box-shadow: 0 4px 0 var(--sky-dark); }
  .choice-option.rank2.selected .rank-badge { background: var(--sky-dark); }
  .choice-option.rank3.selected { border-color: var(--pink-dark); background: var(--pink-soft); box-shadow: 0 4px 0 var(--pink-dark); }
  .choice-option.rank3.selected .rank-badge { background: var(--pink-dark); }

  /* ------------------------------ 학급/배정안 카드 ------------------------------ */
  .draft-card {
    position: relative;
    border: 2px solid var(--line); border-radius: 20px; padding: 16px 20px; margin-bottom: 12px;
    cursor: pointer; background: #fff; box-shadow: 0 3px 0 var(--line);
    transition: transform .2s var(--boing), box-shadow .2s var(--boing), border-color .15s;
  }
  .draft-card:hover { transform: translateY(-3px); border-color: var(--green-line); box-shadow: 0 6px 0 var(--green-soft); }
  .draft-card.final { border-color: var(--green); background: var(--green-soft); box-shadow: 0 4px 0 var(--green); }
  .class-card { position: relative; cursor: pointer; transition: transform .2s var(--boing), box-shadow .2s var(--boing), border-color .15s; }
  .class-card:hover {
    transform: translateY(-4px) rotate(-.5deg); border-color: var(--green-line);
    box-shadow: 0 8px 0 var(--green-soft), 0 16px 28px rgba(80,90,60,.08);
  }
  .class-card .class-emoji { font-size: 30px; line-height: 1; }

  /* ------------------------------ 사용법(튜토리얼) ------------------------------ */
  .step-card {
    display: flex; gap: 16px; align-items: flex-start;
    border: 2px solid var(--line); border-radius: 22px; background: #fff;
    padding: 18px 20px; margin-bottom: 12px;
    box-shadow: 0 3px 0 var(--line);
    animation: pop-in .4s var(--boing) both;
  }
  .step-card .step-num {
    flex-shrink: 0; width: 42px; height: 42px; border-radius: 50%;
    background: var(--green); color: #fff; font-family: "Jua", sans-serif; font-size: 21px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 0 var(--green-dark);
  }
  /* 학생이 하는 일은 파란색 계열로 구분한다 */
  .step-card.for-student .step-num { background: var(--sky); box-shadow: 0 3px 0 var(--sky-dark); }
  .step-card .step-body { min-width: 0; }
  .step-card h3 { color: var(--text); font-size: 17px; margin: 6px 0 6px; font-weight: 700; }
  .step-card p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.75; }
  .step-card .tip {
    margin-top: 10px; font-size: 13px; color: var(--green-dark);
    background: var(--green-soft); border-radius: 13px; padding: 9px 13px; line-height: 1.65;
  }
  .step-card.for-student .tip { color: var(--sky-dark); background: var(--sky-soft); }
  .faq { border-top: 2px dotted var(--line); padding-top: 16px; margin-top: 16px; }
  .faq:first-child { border-top: none; padding-top: 0; margin-top: 0; }
  .faq strong { display: block; font-size: 15px; margin-bottom: 5px; }
  .faq p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.75; }

  /* ------------------------------ 빈 상태 ------------------------------ */
  .empty-state { text-align: center; padding: 34px 20px; color: var(--muted); }
  .empty-state .face { font-size: 44px; display: block; margin-bottom: 8px; animation: float-y 3s ease-in-out infinite; }

  /* ------------------------------ 토스트 ------------------------------ */
  .toast-container {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 9px; z-index: 999; width: 90%; max-width: 420px;
  }
  .toast {
    background: var(--text); color: #fff; padding: 14px 20px; border-radius: 999px; font-size: 14px;
    font-weight: 700; text-align: center;
    box-shadow: 0 8px 22px rgba(0,0,0,.2);
    animation: pop-in .35s var(--boing) both;
  }
  .toast.error { background: var(--danger); }
  .toast.success { background: var(--green-dark); }

  /* ------------------------------ 화면 중앙 / 모달 ------------------------------ */
  .center-screen { min-height: 58vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; }
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(59,60,51,.42); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; z-index: 998; padding: 16px;
  }
  .modal-box {
    background: #fff; border: 3px solid var(--line); border-radius: 28px; padding: 26px;
    max-width: 420px; width: 100%; box-shadow: 0 10px 0 var(--line-dark), 0 24px 44px rgba(0,0,0,.16);
    animation: pop-in .34s var(--boing) both; text-align: center;
  }

  /* ------------------------------ 발표용 화면 ------------------------------ */
  .present-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px; }
  .present-role {
    border: 2px solid var(--line); border-radius: 24px; padding: 20px; background: #fff;
    border-top: 9px solid var(--green); box-shadow: 0 4px 0 var(--line);
    animation: pop-in .45s var(--boing) both;
  }

const isFirebaseConfigured = !Object.values(CONFIG.firebase).some((v) => String(v).startsWith("REPLACE_WITH"));

// ------------------------------ 배정 알고리즘 (min-cost max-flow) ------------------------------
// students: [{ id(=학번), choices: [roleId, ...] (1~3개, 우선순위 순) }]  — 지망을 제출한 학생만 넘긴다.
// roles: [{ id, capacity }]
// 반환: { assignments: {학번: roleId|null}, stats: {first, second, third, unassigned} }
function computeAssignment(students, roles) {
  if (students.length === 0) {
    return { assignments: {}, stats: { first: 0, second: 0, third: 0, unassigned: 0 } };
  }

  const shuffledStudents = shuffleArray(students);
  const S = shuffledStudents.length;
  const R = roles.length;
  const source = 0;
  const sink = S + R + 1;
  const N = S + R + 2;

  // 사전식(lexicographic) 우선순위 보장 비용 설계.
  // "1지망 인원 최대화가 최우선, 그다음 2지망, 그다음 3지망"을 순수 총비용 최소화만으로 달성하려면
  // 인접 등급 간 비용 격차가 "하위 등급 학생 전원을 최대로 개선했을 때의 이득 총합"보다 커야 한다.
  // (선형 가중치 0/10/100처럼 격차가 작으면, 상위 지망 1명을 희생해 하위 지망 여러 명을 구제하는
  //  왜곡이 생길 수 있다 — 실제로 이 구현에서 테스트로 확인 후 지수적 가중치로 수정함.)
  // base가 학생 수(S)보다 충분히 크면, 어떤 하위 등급 재배치도 상위 등급 1단계 변화를 절대 앞서지 못한다.
  const base = S * 2 + 10;
  const costByRank = [-(base * base), -base, -1]; // 1/2/3지망 (음수= 비용 최소화 시 우대됨)
  const unassignedCost = 0; // 미배정이 가장 나쁨

  const roleIndex = new Map(roles.map((r, i) => [r.id, S + 1 + i]));
  const graph = Array.from({ length: N }, () => []);
  const addEdge = (u, v, cap, cost) => {
    graph[u].push({ to: v, cap, cost, flow: 0, rev: graph[v].length });
    graph[v].push({ to: u, cap: 0, cost: -cost, flow: 0, rev: graph[u].length - 1 });
  };

  shuffledStudents.forEach((s, i) => {
    const node = 1 + i;
    addEdge(source, node, 1, 0);
    s.choices.slice(0, 3).forEach((roleId, rank) => {
      const rNode = roleIndex.get(roleId);
      if (rNode === undefined) return; // 삭제된 역할을 지망했던 경우 방어적으로 무시
      addEdge(node, rNode, 1, costByRank[rank] ?? -1);
    });
    // 미배정도 유량의 일부로 명시적으로 모델링(항상 sink까지 경로 확보) → 최대유량이 학생 수로 고정되고,
    // 그 안에서의 순수 비용 최소화만으로 등급별 인원 사전식 최대화가 성립한다.
    addEdge(node, sink, 1, unassignedCost);
  });
  roles.forEach((r) => addEdge(roleIndex.get(r.id), sink, r.capacity, 0));

  // SPFA 기반 최소비용 최대유량 (successive shortest augmenting path)
  while (true) {
    const dist = new Array(N).fill(Infinity);
    const inQueue = new Array(N).fill(false);
    const prevEdge = new Array(N).fill(null);
    dist[source] = 0;
    const queue = [source];
    inQueue[source] = true;
    while (queue.length) {
      const u = queue.shift();
      inQueue[u] = false;
      for (let ei = 0; ei < graph[u].length; ei++) {
        const e = graph[u][ei];
        if (e.cap - e.flow <= 0) continue;
        const nd = dist[u] + e.cost;
        if (nd < dist[e.to]) {
          dist[e.to] = nd;
          prevEdge[e.to] = { u, ei };
          if (!inQueue[e.to]) { queue.push(e.to); inQueue[e.to] = true; }
        }
      }
    }
    if (dist[sink] === Infinity) break;
    let aug = Infinity, v = sink;
    while (v !== source) { const { u, ei } = prevEdge[v]; aug = Math.min(aug, graph[u][ei].cap - graph[u][ei].flow); v = u; }
    v = sink;
    while (v !== source) {
      const { u, ei } = prevEdge[v];
      graph[u][ei].flow += aug;
      graph[v][graph[u][ei].rev].flow -= aug;
      v = u;
    }
  }

  const assignments = {};
  students.forEach((s) => { assignments[s.id] = null; });
  shuffledStudents.forEach((s, i) => {
    const node = 1 + i;
    for (const e of graph[node]) {
      if (e.flow > 0 && e.to >= S + 1 && e.to <= S + R) {
        const role = roles.find((r) => roleIndex.get(r.id) === e.to);
        assignments[s.id] = role.id;
      }
    }
  });

  const stats = { first: 0, second: 0, third: 0, unassigned: 0 };
  students.forEach((s) => {
    const assigned = assignments[s.id];
    if (assigned === null) { stats.unassigned++; return; }
    const rank = s.choices.indexOf(assigned);
    if (rank === 0) stats.first++; else if (rank === 1) stats.second++; else if (rank === 2) stats.third++;
  });

  return { assignments, stats };
}

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ------------------------------ 명단 붙여넣기 파싱 ------------------------------
// 역할 이름에서 키워드를 찾아 이모지를 고른다.

  ["휴지", "🧻"], ["우산", "☂️"], ["수리", "🔧"], ["고장", "🔧"],
  ["핸드폰", "📱"], ["휴대폰", "📱"], ["가정통신문", "✉️"], ["통신문", "✉️"], ["업무", "🗂️"],
  ["부회장", "🎖️"], ["반장", "👑"], ["회장", "👑"], ["책", "📖"], ["물", "💧"],

function roleEmoji(name) {
  const n = String(name || "");
  for (const [key, emoji] of ROLE_EMOJI) if (n.includes(key)) return emoji;
  return "🌟";  // 매칭 실패 시 기본값
}

function parseRosterPaste(text) {
  const lines = text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
  const rows = [];
  for (const line of lines) {
    const cols = line.split(/\t|,|\s{2,}/).map((c) => c.trim()).filter((c) => c !== "");
    if (cols.length < 1) continue;
    // 헤더로 보이는 행("학번", "번호", "이름" 등)은 건너뛴다
    if (/^(학번|번호|no\.?|number)$/i.test(cols[0])) continue;
    const number = cols[0];
    const name = cols[1] || "";
    if (!number) continue;
    rows.push({ number, name });
  }
  return rows;
}

function generateRangeRows(start, end) {
  const s = parseInt(start, 10), e = parseInt(end, 10);
  if (isNaN(s) || isNaN(e) || s > e) return [];
  const rows = [];
  for (let n = s; n <= e; n++) rows.push({ number: String(n), name: "" });
  return rows;
}

// ------------------------------ Firebase ------------------------------
let firebaseApp = null, auth = null, db = null, fs = null, authMod = null;
async function initFirebase() {
  if (!isFirebaseConfigured) return;
  const [{ initializeApp }, authModule, fsModule] = await Promise.all([
    import("https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js"),

  ]);

  authMod = authModule;

  auth = authModule.getAuth(firebaseApp);
  db = fsModule.getFirestore(firebaseApp);

// ------------------------------ CSV / 인쇄 ------------------------------
function downloadCsv(filename, rows) {
  const csv = rows.map((r) => r.map((c) => `"${String(c ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ------------------------------ Vue App ------------------------------
const { createApp, ref, reactive, computed, watch, onMounted, onBeforeUnmount, nextTick } = Vue;

const App = {
  setup() {
    const loadingApp = ref(true);
    const firebaseConfigured = ref(isFirebaseConfigured);

    // 학생 모드 여부: ?s=classId 쿼리 파라미터로 판별
    const urlParams = new URLSearchParams(location.search);
    const studentMode = ref(urlParams.has("s"));
    const studentClassId = ref(urlParams.get("s") || "");

    const toasts = reactive([]);
    let toastSeq = 0;
    function toast(message, type = "info") {
      const id = ++toastSeq;
      toasts.push({ id, message, type });
      setTimeout(() => { const idx = toasts.findIndex((t) => t.id === id); if (idx >= 0) toasts.splice(idx, 1); }, 3200);
    }

    // ---------------- 라우팅 (해시 기반, 교사 화면 전용) ----------------
    const route = reactive({ view: "classes", classId: null, draftId: null });
    function parseHash() {
      const h = location.hash.replace(/^#\/?/, "");
      const parts = h.split("/").filter(Boolean);
      if (parts[0] === "guide") {
        route.view = "guide"; route.classId = null; route.draftId = null;
      } else if (parts[0] === "class" && parts[1]) {
        route.classId = decodeURIComponent(parts[1]);
        if (parts[2] === "draft" && parts[3]) { route.view = "draft"; route.draftId = decodeURIComponent(parts[3]); }
        else if (parts[2] === "present") { route.view = "present"; route.draftId = null; }
        else { route.view = "class"; route.draftId = null; }
      } else {
        route.view = "classes"; route.classId = null; route.draftId = null;
      }
    }
    function go(hash) { location.hash = hash; }
    window.addEventListener("hashchange", parseHash);

    // ---------------- 인증 ----------------
    // 구글 로그인과 익명 로그인을 모두 지원한다.
    // 익명 계정도 uid 를 받으므로 ownerUid 기반 보안 규칙은 손대지 않아도 그대로 동작한다.
    // 대신 익명 계정은 이 브라우저에만 묶여 있어서, 방문 기록을 지우면 되살릴 방법이 없다.
    // 그래서 (a) 시작 화면에서 미리 알리고 (b) 학급 목록에 배너를 띄우고
    // (c) 로그아웃 전에 한 번 더 확인하고 (d) 언제든 구글 계정에 연결할 수 있게 했다.
    const user = ref(null);
    const isAnonymous = computed(() => !!user.value?.isAnonymous);
    const userLabel = computed(() => {
      if (!user.value) return "";
      return user.value.displayName || user.value.email || "익명 사용자";
    });
    const linking = ref(false);

    async function signIn() {
      try {
        const provider = new authMod.GoogleAuthProvider();
        await authMod.signInWithPopup(auth, provider);
      } catch (e) {
        if (e.code !== "auth/popup-closed-by-user") toast("로그인에 실패했습니다: " + e.message, "error");
      }
    }

    // 로그인 없이 바로 시작 — 익명 계정을 발급받는다
    async function signInAnon() {
      try {
        await authMod.signInAnonymously(auth);
      } catch (e) {
        if (e.code === "auth/operation-not-allowed") {
          toast("Firebase 콘솔에서 '익명' 로그인 방식을 먼저 켜주세요.", "error");
        } else {
          toast("시작하지 못했습니다: " + e.message, "error");
        }
      }
    }

    // 익명 계정을 구글 계정에 연결한다.
    // linkWithPopup 은 uid 를 그대로 유지하므로, 이미 만들어 둔 학급이 전부 따라온다.
    async function linkGoogle() {
      if (!auth.currentUser || linking.value) return;
      linking.value = true;
      try {
        const provider = new authMod.GoogleAuthProvider();
        await authMod.linkWithPopup(auth.currentUser, provider);
        user.value = auth.currentUser;  // 연결만으로는 onAuthStateChanged 가 안 올 수 있어 직접 갱신
        toast("구글 계정과 연결했어요. 이제 다른 기기에서도 이어서 쓸 수 있습니다.", "success");
      } catch (e) {
        if (e.code === "auth/credential-already-in-use") {
          toast("이미 이 앱을 쓰고 있는 구글 계정입니다. 로그아웃한 뒤 그 계정으로 로그인해주세요.", "error");
        } else if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") {
          toast("연결에 실패했습니다: " + e.message, "error");
        }
      } finally { linking.value = false; }
    }

    async function signOutUser() {
      // 익명 계정은 로그아웃하면 되찾을 방법이 없으므로 반드시 한 번 더 확인한다
      if (isAnonymous.value) {
        askConfirm(
          "로그인 없이 사용 중입니다. 로그아웃하면 지금까지 만든 학급에 다시 들어갈 수 없어요. 그래도 로그아웃할까요?",
          async () => { await authMod.signOut(auth); go("#/classes"); },
          { icon: "👋", confirmLabel: "로그아웃" }
        );
        return;
      }
      await authMod.signOut(auth);
      go("#/classes");
    }

    // ---------------- 교사: 학급 목록 ----------------
    const classes = ref([]);
    let unsubClasses = null;
    function subscribeClasses() {
      if (unsubClasses) unsubClasses();
      const q = fs.query(classesCol(), fs.where("ownerUid", "==", user.value.uid));
      unsubClasses = fs.onSnapshot(q, (snap) => {
        classes.value = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
      });
    }
    const newClassName = ref("");
    async function createClass() {
      const name = newClassName.value.trim();
      if (!name) return;
      const docRef = await fs.addDoc(classesCol(), {
        ownerUid: user.value.uid, className: name, submissionOpen: false,
        createdAt: fs.serverTimestamp(), updatedAt: fs.serverTimestamp(),
      });
      newClassName.value = "";
      go(`#/class/${docRef.id}`);
    }
    async function deleteClass(classId) {
      await fs.deleteDoc(classDocRef(classId));
      toast("학급을 삭제했습니다.");
    }

    // ---------------- 교사: 학급 작업공간 ----------------
    const currentClass = ref(null);
    const students = ref([]);
    const roles = ref([]);
    const preferences = ref({}); // { 학번: {choices, submittedAt} }
    const drafts = ref([]);
    const activeTab = ref("roster");
    let unsubClass = null, unsubStudents = null, unsubRoles = null, unsubPrefs = null, unsubDrafts = null;

    function clearClassSubs() {
      [unsubClass, unsubStudents, unsubRoles, unsubPrefs, unsubDrafts].forEach((u) => u && u());
      unsubClass = unsubStudents = unsubRoles = unsubPrefs = unsubDrafts = null;
    }

    function subscribeClass(classId) {
      clearClassSubs();
      currentClass.value = null; students.value = []; roles.value = []; preferences.value = {}; drafts.value = [];
      unsubClass = fs.onSnapshot(classDocRef(classId), (d) => { currentClass.value = d.exists() ? { id: d.id, ...d.data() } : null; });
      unsubStudents = fs.onSnapshot(studentsCol(classId), (snap) => {
        students.value = snap.docs.map((d) => ({ number: d.id, ...d.data() })).sort((a, b) => naturalCompare(a.number, b.number));
      });
      unsubRoles = fs.onSnapshot(rolesCol(classId), (snap) => {
        roles.value = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
      });
      unsubPrefs = fs.onSnapshot(prefsCol(classId), (snap) => {
        const map = {};
        snap.docs.forEach((d) => { map[d.id] = d.data(); });
        preferences.value = map;
      });
      unsubDrafts = fs.onSnapshot(draftsCol(classId), (snap) => {
        drafts.value = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
      });
    }

    function naturalCompare(a, b) {
      const na = parseFloat(a), nb = parseFloat(b);
      if (!isNaN(na) && !isNaN(nb) && String(na) === a && String(nb) === b) return na - nb;
      return String(a).localeCompare(String(b), "ko");
    }

    watch(() => route.classId, (id) => {
      if (id && (route.view === "class" || route.view === "draft" || route.view === "present")) subscribeClass(id);
      if (!id) clearClassSubs();
    }, { immediate: true });

    // ---------------- 명단 등록 ----------------
    const pasteText = ref("");
    const pastePreview = computed(() => parseRosterPaste(pasteText.value));
    async function confirmPasteImport() {
      const rows = pastePreview.value;
      if (rows.length === 0) return toast("붙여넣은 내용에서 인식된 행이 없습니다.", "error");
      const batch = fs.writeBatch(db);
      rows.forEach((r) => { batch.set(fs.doc(studentsCol(route.classId), r.number), { name: r.name }, { merge: true }); });
      await batch.commit();
      pasteText.value = "";
      toast(`${rows.length}명을 등록했습니다.`, "success");
    }
    const rangeStart = ref(""), rangeEnd = ref("");
    async function confirmRangeGenerate() {
      const rows = generateRangeRows(rangeStart.value, rangeEnd.value);
      if (rows.length === 0) return toast("유효한 번호 범위를 입력하세요.", "error");
      const batch = fs.writeBatch(db);
      rows.forEach((r) => { batch.set(fs.doc(studentsCol(route.classId), r.number), { name: r.name }, { merge: true }); });
      await batch.commit();
      rangeStart.value = ""; rangeEnd.value = "";
      toast(`${rows.length}개 번호 행을 생성했습니다. 이름을 채워주세요.`, "success");
    }
    async function updateStudentName(number, name) {
      await fs.setDoc(fs.doc(studentsCol(route.classId), number), { name }, { merge: true });
    }
    const newStudentNumber = ref(""), newStudentName = ref("");
    async function addStudentManually() {
      const num = newStudentNumber.value.trim();
      if (!num) return;
      if (num.includes("/")) return toast("학번에 '/' 문자는 사용할 수 없습니다.", "error");
      await fs.setDoc(fs.doc(studentsCol(route.classId), num), { name: newStudentName.value.trim() }, { merge: true });
      newStudentNumber.value = ""; newStudentName.value = "";
    }
    async function deleteStudent(number) { await fs.deleteDoc(fs.doc(studentsCol(route.classId), number)); }

    // ---------------- 역할 설정 ----------------
    async function loadPreset() {
      const batch = fs.writeBatch(db);
      CONFIG.rolePresets.forEach((r, i) => {
        batch.set(fs.doc(rolesCol(route.classId)), { name: r.name, capacity: r.capacity, order: i });
      });
      await batch.commit();
      toast("기본 프리셋을 불러왔습니다.");
    }
    async function addRole() {
      await fs.addDoc(rolesCol(route.classId), { name: "새 역할", capacity: 1, order: roles.value.length });
    }
    async function updateRole(roleId, patch) { await fs.updateDoc(fs.doc(rolesCol(route.classId), roleId), patch); }
    async function deleteRole(roleId) { await fs.deleteDoc(fs.doc(rolesCol(route.classId), roleId)); }

    const capacityTotal = computed(() => roles.value.reduce((sum, r) => sum + (Number(r.capacity) || 0), 0));
    const studentCount = computed(() => students.value.length);
    const capacityShort = computed(() => Math.max(0, studentCount.value - capacityTotal.value));

    // ---------------- 지망 접수 관리 ----------------
    async function toggleSubmission() {
      await fs.updateDoc(classDocRef(route.classId), { submissionOpen: !currentClass.value.submissionOpen, updatedAt: fs.serverTimestamp() });
    }
    const joinUrl = computed(() => {
      if (!route.classId) return "";
      const base = location.origin + location.pathname;
      return `${base}?s=${route.classId}`;
    });
    const qrCanvas = ref(null);
    watch(
      [joinUrl, () => activeTab.value, () => currentClass.value?.submissionOpen],
      async ([url, tab, open]) => {
        if (tab !== "collect" || !open || !url) return;
        await nextTick();
        if (qrCanvas.value) qrToCanvas(qrCanvas.value, url, { width: 200, margin: 1 }, () => {});
      }
    );

    const submittedNumbers = computed(() => new Set(Object.keys(preferences.value)));
    const submittedList = computed(() => students.value.filter((s) => submittedNumbers.value.has(s.number)));
    const notSubmittedList = computed(() => students.value.filter((s) => !submittedNumbers.value.has(s.number)));
    const firstChoiceCounts = computed(() => {
      const counts = {};
      roles.value.forEach((r) => { counts[r.id] = 0; });
      Object.values(preferences.value).forEach((p) => {
        const first = p.choices && p.choices[0];
        if (first && counts[first] !== undefined) counts[first]++;
      });
      return counts;
    });
    function roleName(roleId) { const r = roles.value.find((x) => x.id === roleId); return r ? r.name : "(삭제된 역할)"; }

    // ---------------- 배정 실행 ----------------
    const running = ref(false);
    async function runAssignment() {
      if (roles.value.length === 0) return toast("역할을 먼저 설정하세요.", "error");
      running.value = true;
      try {
        const roleIds = new Set(roles.value.map((r) => r.id));
        const studentInputs = Object.entries(preferences.value)
          .filter(([num]) => students.value.some((s) => s.number === num)) // 명단에서 삭제된 학생 제외
          .map(([num, p]) => ({ id: num, choices: (p.choices || []).filter((c) => roleIds.has(c)) }));
        const { assignments, stats } = computeAssignment(studentInputs, roles.value.map((r) => ({ id: r.id, capacity: Number(r.capacity) || 0 })));
        await fs.addDoc(draftsCol(route.classId), { assignments, stats, isFinal: false, createdAt: fs.serverTimestamp() });
        toast("배정안을 생성했습니다.", "success");
      } finally { running.value = false; }
    }

    // ---------------- 배정안 상세 ----------------
    const currentDraft = computed(() => drafts.value.find((d) => d.id === route.draftId) || null);
    const unassignedRoster = computed(() => {
      if (!currentDraft.value) return [];
      return students.value.filter((s) => !currentDraft.value.assignments[s.number]).map((s) => ({
        ...s, submitted: submittedNumbers.value.has(s.number),
      }));
    });
    const roleAssignedCounts = computed(() => {
      const counts = {};
      if (currentDraft.value) Object.values(currentDraft.value.assignments).forEach((roleId) => { if (roleId) counts[roleId] = (counts[roleId] || 0) + 1; });
      return counts;
    });
    async function reassignStudent(number, roleId) {
      const draft = currentDraft.value;
      if (!draft) return;
      const role = roles.value.find((r) => r.id === roleId);
      if (roleId) {
        const currentCount = Object.entries(draft.assignments).filter(([n, r]) => r === roleId && n !== number).length;
        if (role && currentCount >= role.capacity) toast(`'${role.name}' 정원(${role.capacity}명)을 초과합니다. 그래도 반영되었습니다.`, "error");
      }
      const newAssignments = { ...draft.assignments, [number]: roleId || null };
      const stats = recomputeStats(newAssignments);
      await fs.updateDoc(fs.doc(draftsCol(route.classId), draft.id), { assignments: newAssignments, stats });
    }
    function recomputeStats(assignments) {
      const stats = { first: 0, second: 0, third: 0, unassigned: 0 };
      Object.entries(assignments).forEach(([num, roleId]) => {
        if (!roleId) { stats.unassigned++; return; }
        const choices = preferences.value[num]?.choices || [];
        const rank = choices.indexOf(roleId);
        if (rank === 0) stats.first++; else if (rank === 1) stats.second++; else if (rank === 2) stats.third++;
        else stats.unassigned += 0; // 수동으로 지망 외 역할을 배정한 경우 (통계에서 어떤 지망에도 안 잡힘, 정상)
      });
      return stats;
    }
    async function finalizeDraft(draftId) {
      const batch = fs.writeBatch(db);
      drafts.value.forEach((d) => { if (d.isFinal && d.id !== draftId) batch.update(fs.doc(draftsCol(route.classId), d.id), { isFinal: false }); });
      batch.update(fs.doc(draftsCol(route.classId), draftId), { isFinal: true });
      await batch.commit();
      toast("배정안을 최종 확정했습니다.", "success");
    }
    async function unlockDraft(draftId) {
      await fs.updateDoc(fs.doc(draftsCol(route.classId), draftId), { isFinal: false });
    }
    async function deleteDraft(draftId) {
      await fs.deleteDoc(fs.doc(draftsCol(route.classId), draftId));
      go(`#/class/${route.classId}`);
    }

    const finalDraft = computed(() => drafts.value.find((d) => d.isFinal) || null);
    function exportCsv() {
      const draft = currentDraft.value || finalDraft.value;
      if (!draft) return toast("내보낼 배정안이 없습니다.", "error");
      const rows = [["학번", "이름", "배정된 역할", "지망 순위"]];
      students.value.forEach((s) => {
        const roleId = draft.assignments[s.number];
        const choices = preferences.value[s.number]?.choices || [];
        const rank = roleId ? choices.indexOf(roleId) : -1;
        rows.push([s.number, s.name, roleId ? roleName(roleId) : "미배정", rank >= 0 ? `${rank + 1}지망` : ""]);
      });
      downloadCsv(`${currentClass.value?.className || "학급"}_배정결과.csv`, rows);
    }

    // ---------------- 발표용 화면 ----------------
    const presentPalette = ["#62C370", "#F3B33D", "#FF8FB1", "#79C6EE", "#A98BE8", "#F2915E"];
    function presentColor(i) { return presentPalette[i % presentPalette.length]; }
    const presentGroups = computed(() => {
      const draft = finalDraft.value;
      if (!draft) return [];
      return roles.value.map((r) => ({
        role: r,
        names: students.value.filter((s) => draft.assignments[s.number] === r.id).map((s) => s.name || s.number),
      }));
    });
    const presentUnassigned = computed(() => {
      const draft = finalDraft.value;
      if (!draft) return [];
      return students.value.filter((s) => !draft.assignments[s.number]).map((s) => s.name || s.number);
    });

    // ---------------- 삭제 확인 모달 ----------------
    const confirmModal = ref(null); // { message, onConfirm }
    // opts 로 아이콘과 확인 버튼 문구를 바꿀 수 있다 (삭제 말고 다른 확인에도 쓰기 위해)
    function askConfirm(message, onConfirm, opts) {
      confirmModal.value = {
        message, onConfirm,
        icon: (opts && opts.icon) || "🗑️",
        confirmLabel: (opts && opts.confirmLabel) || "삭제",
      };
    }
    function resolveConfirm(ok) {
      const m = confirmModal.value; confirmModal.value = null;
      if (ok && m) m.onConfirm();
    }

    // ---------------- 학생 모드 ----------------
    const stuLoading = ref(true);
    const stuError = ref("");
    const stuClass = ref(null);
    const stuRoles = ref([]);
    const stuStep = ref("number"); // number | confirm | choose | done
    const stuNumberInput = ref("");
    const stuMatched = ref(null);
    const stuChoice1 = ref(""), stuChoice2 = ref(""), stuChoice3 = ref("");
    const stuSubmitting = ref(false);
    const stuLooking = ref(false);   // 번호 조회 중 (초기 로딩용 stuLoading 과 구분)

    async function loadStudentClass() {
      try {
        const cSnap = await fs.getDoc(classDocRef(studentClassId.value));
        if (!cSnap.exists()) { stuError.value = "존재하지 않는 학급 링크입니다."; return; }
        stuClass.value = { id: cSnap.id, ...cSnap.data() };
        const rSnap = await fs.getDocs(rolesCol(studentClassId.value));
        stuRoles.value = rSnap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
      } catch (e) {
        stuError.value = "학급 정보를 불러오지 못했습니다.";
      } finally { stuLoading.value = false; }
    }
    async function stuLookup() {
      const num = stuNumberInput.value.trim();
      if (!num) return;
      stuLooking.value = true;
      try {
        const sSnap = await fs.getDoc(fs.doc(studentsCol(studentClassId.value), num));
        if (!sSnap.exists()) { toast("명단에서 번호를 찾을 수 없습니다.", "error"); return; }
        stuMatched.value = { number: num, name: sSnap.data().name || "" };

        // 이미 낸 지망을 미리 채워 주려는 시도.
        // preferences 는 교사만 읽을 수 있으므로(보안 규칙) 학생 기기에서는 권한 오류가 나는 게 정상이다.
        // 여기서 예외가 새어 나가면 확인 화면으로 넘어가지 못하고 번호 입력으로 되돌아가 버리므로
        // 반드시 따로 삼킨다. 미리 채우기는 어차피 부가 기능이라 실패해도 그냥 빈 상태로 고르면 된다.
        try {
          const pSnap = await fs.getDoc(fs.doc(prefsCol(studentClassId.value), num));
          if (pSnap.exists()) {
            const c = pSnap.data().choices || [];
            stuChoice1.value = c[0] || ""; stuChoice2.value = c[1] || ""; stuChoice3.value = c[2] || "";
          }
        } catch (e) { /* 권한 없음 — 학생은 원래 못 읽는다. 빈 상태로 진행한다. */ }

        stuStep.value = "confirm";
      } catch (e) {
        // 이제는 조용히 되돌아가지 않고 이유를 보여 준다
        toast("번호를 확인하지 못했습니다. 잠시 후 다시 시도해주세요.", "error");
      } finally { stuLooking.value = false; }
    }
    function stuProceedToChoose() { stuStep.value = "choose"; }
    function stuSelect(rank, roleId) {
      const cur = [stuChoice1, stuChoice2, stuChoice3];
      // 다른 순위에서 이미 선택된 역할이면 그 순위는 해제 (중복 선택 불가)
      cur.forEach((c, i) => { if (i !== rank && c.value === roleId) c.value = ""; });
      cur[rank].value = cur[rank].value === roleId ? "" : roleId;
    }
    async function stuSubmit() {
      if (!stuChoice1.value) return toast("1지망은 반드시 선택해야 합니다.", "error");
      stuSubmitting.value = true;
      try {
        const choices = [stuChoice1.value, stuChoice2.value, stuChoice3.value].filter(Boolean);
        await fs.setDoc(fs.doc(prefsCol(studentClassId.value), stuMatched.value.number), {
          choices, submittedAt: fs.serverTimestamp(),
        }, { merge: true });
        stuStep.value = "done";
      } catch (e) {
        // 원인을 단정하지 않는다. permission-denied 하나에도 (a) 접수 마감 (b) 명단에 없는 번호
        // (c) 보안 규칙이 최신이 아님 이 전부 섞여 있어서, 예전 문구("접수가 마감되었을 수 있습니다")는
        // 실제로는 규칙 문제일 때도 교사를 엉뚱한 곳으로 보냈다. 오류 코드를 그대로 보여 준다.
        const code = (e && e.code) ? e.code : "unknown";
        toast("제출하지 못했어요. 선생님께 이 화면을 보여 주세요. (" + code + ")", "error");
        console.error("[1P1J] 지망 제출 실패", e);
      } finally { stuSubmitting.value = false; }
    }
    function stuEditAgain() { stuStep.value = "choose"; }

    // ---------------- 초기화 ----------------
    onMounted(async () => {
      if (!firebaseConfigured.value) { loadingApp.value = false; return; }
      await initFirebase();
      if (studentMode.value) {
        await loadStudentClass();
        loadingApp.value = false;
        return;
      }
      parseHash();
      authMod.onAuthStateChanged(auth, (u) => {
        user.value = u;
        loadingApp.value = false;
        if (u) subscribeClasses();
      });
    });
    onBeforeUnmount(() => { clearClassSubs(); if (unsubClasses) unsubClasses(); window.removeEventListener("hashchange", parseHash); });

    return {
      loadingApp, firebaseConfigured, studentMode,
      toasts, route, go,
      user, signIn, signInAnon, signOutUser, isAnonymous, userLabel, linkGoogle, linking,
      classes, newClassName, createClass, deleteClass,
      currentClass, students, roles, preferences, drafts, activeTab,
      pasteText, pastePreview, confirmPasteImport, rangeStart, rangeEnd, confirmRangeGenerate,
      updateStudentName, newStudentNumber, newStudentName, addStudentManually, deleteStudent,
      loadPreset, addRole, updateRole, deleteRole, capacityTotal, studentCount, capacityShort,
      toggleSubmission, joinUrl, qrCanvas, submittedList, notSubmittedList, firstChoiceCounts, roleName, roleEmoji,
      running, runAssignment,
      currentDraft, unassignedRoster, roleAssignedCounts, reassignStudent, finalizeDraft, unlockDraft, deleteDraft,

                <input class="input" style="max-width:100px" v-model="newStudentNumber" placeholder="학번" />
                <input class="input" v-model="newStudentName" placeholder="이름" @keyup.enter="addStudentManually" />
                <button class="btn" @click="addStudentManually">추가</button>
              </div>
            </div>

                  <tr v-for="s in students" :key="s.number">
                    <td>{{s.number}}</td>
                    <td><input class="input" :value="s.name" @change="updateStudentName(s.number, $event.target.value)" /></td>
                    <td><button class="btn btn-sm btn-danger" @click="askConfirm(s.number+'번 학생을 삭제할까요?', ()=>deleteStudent(s.number))">삭제</button></td>
                  </tr>
                </tbody></table>
              </div>

          <div v-if="activeTab==='roles'">

              <div class="row-between">

                  <button class="btn btn-sm" @click="addRole">역할 추가</button>

            <div class="card">
              <div class="row-between">

                <div class="stat-box s0"><div class="num">{{ students.length }}</div><div class="label">전체</div></div>
              </div>
            </div>

            <div class="card">
              <h3>📊 역할별 1지망 집중도</h3>

              </div>

          </div>

          <!-- 배정 -->
          <div v-if="activeTab==='assign'">
            <div class="card">
              <button class="btn btn-primary btn-lg" :disabled="running" @click="runAssignment">
                {{ running ? '계산 중...' : '✨ 배정 실행하기' }}
              </button>
              <p class="hint">여러 번 실행해서 결과를 비교할 수 있어요. 실행할 때마다 새 배정안이 저장되고, 동점인 최적해가 여러 개면 매번 조금씩 다른 결과가 나옵니다.</p>
            </div>
            <h2 style="margin:20px 0 12px">배정안 목록</h2>
            <div v-if="drafts.length===0" class="card">
              <div class="empty-state">
                <span class="face">🎲</span>
                <h2 style="margin:0">아직 배정안이 없어요</h2>
                <p class="muted" style="margin:4px 0 0">위 버튼을 눌러 첫 배정을 돌려 보세요.</p>
              </div>
            </div>
            <div v-for="(d,i) in drafts" :key="d.id" class="draft-card" :class="{final: d.isFinal}" @click="go('#/class/'+route.classId+'/draft/'+d.id)">
              <span v-if="i===0 && !d.isFinal" class="ribbon">NEW</span>
              <div class="row-between">
                <strong style="font-size:17px">안 {{ drafts.length - i }} <span v-if="d.isFinal" class="badge badge-green" style="margin-left:6px">최종 확정</span></strong>
              </div>
              <p class="hint">1지망 {{d.stats.first}}명 · 2지망 {{d.stats.second}}명 · 3지망 {{d.stats.third}}명 · 미배정 {{d.stats.unassigned}}명</p>
            </div>
          </div>
        </template>

        <!-- 배정안 상세 -->
        <template v-else-if="route.view === 'draft' && currentDraft">
          <div class="row-between" style="margin-bottom:14px">
            <button class="btn btn-sm" @click="go('#/class/'+route.classId)">← 배정 목록</button>
            <button class="btn btn-sm" @click="exportCsv">CSV 내보내기</button>
          </div>

          <div class="card">
            <div class="stat-grid">
              <div class="stat-box s1"><div class="num">{{currentDraft.stats.first}}</div><div class="label">1지망</div></div>
              <div class="stat-box s2"><div class="num">{{currentDraft.stats.second}}</div><div class="label">2지망</div></div>
              <div class="stat-box s3"><div class="num">{{currentDraft.stats.third}}</div><div class="label">3지망</div></div>
              <div class="stat-box s0"><div class="num">{{currentDraft.stats.unassigned}}</div><div class="label">미배정</div></div>
            </div>
            <div class="row" style="margin-top:14px">
              <button v-if="!currentDraft.isFinal" class="btn btn-primary" @click="finalizeDraft(currentDraft.id)">🎯 최종 확정</button>
              <button v-else class="btn" @click="unlockDraft(currentDraft.id)">확정 해제</button>
              <button v-if="currentDraft.isFinal" class="btn btn-pink" @click="go('#/class/'+route.classId+'/present')">📣 발표용 화면 열기</button>
              <button class="btn btn-danger" @click="askConfirm('이 배정안을 삭제할까요?', ()=>deleteDraft(currentDraft.id))">삭제</button>
            </div>
          </div>

          <div class="card">
            <h3>✍️ 학생별 배정 (직접 수정 가능)</h3>
            <div class="tbl-wrap"><table class="tbl">
              <thead><tr><th>학번</th><th>이름</th><th>지망</th><th>배정된 역할</th></tr></thead>
              <tbody>
                <tr v-for="s in students" :key="s.number">
                  <td>{{s.number}}</td><td>{{s.name}}</td>
                  <td class="muted">{{ (preferences[s.number]?.choices||[]).map(roleName).join(' > ') || '미제출' }}</td>
                  <td>
                    <select class="input" :value="currentDraft.assignments[s.number] || ''" @change="reassignStudent(s.number, $event.target.value)">
                      <option value="">미배정</option>
                      <option v-for="r in roles" :key="r.id" :value="r.id">{{ roleEmoji(r.name) }} {{r.name}} ({{roleAssignedCounts[r.id]||0}}/{{r.capacity}})</option>
                    </select>
                  </td>
                </tr>
              </tbody>
            </table></div>
          </div>

          <div class="card" v-if="unassignedRoster.length">
            <h3>🙋 미배정 학생 ({{unassignedRoster.length}}명)</h3>
            <div class="row">
              <span v-for="s in unassignedRoster" :key="s.number" class="badge" :class="s.submitted ? 'badge-blue' : 'badge-gray'" style="margin:2px">
                {{s.number}} {{s.name}} {{ s.submitted ? '' : '(미제출)' }}
              </span>
            </div>
          </div>
        </template>

        <!-- 발표용 화면 -->
        <template v-else-if="route.view === 'present'">
          <div class="row-between no-print" style="margin-bottom:14px">
            <button class="btn btn-sm" @click="go('#/class/'+route.classId)">← 돌아가기</button>
            <button class="btn btn-sm" @click="window.print()">🖨 인쇄</button>
          </div>
          <div v-if="!finalDraft" class="center-screen"><p>확정된 배정안이 없습니다.</p></div>
          <template v-else>
            <div class="present-grid">
              <div v-for="(g,gi) in presentGroups" :key="g.role.id" class="present-role" :style="{borderTopColor: presentColor(gi)}">
                <h3><span class="role-emoji">{{ roleEmoji(g.role.name) }}</span>{{ g.role.name }}</h3>
                <div class="names">{{ g.names.join(', ') || '-' }}</div>
              </div>
            </div>
            <div v-if="presentUnassigned.length" class="present-role" style="margin-top:16px">
              <h3>🙋 미배정</h3>
              <div class="names">{{ presentUnassigned.join(', ') }}</div>
            </div>
          </template>
        </template>

        <div v-else class="center-screen"><p>불러오는 중...</p></div>
      </main>
    </template>

    <!-- 삭제 확인 모달 -->
    <div v-if="confirmModal" class="modal-backdrop" @click.self="resolveConfirm(false)">
      <div class="modal-box">
        <div style="font-size:42px;line-height:1">{{ confirmModal.icon }}</div>
        <p style="margin:10px 0 0">{{ confirmModal.message }}</p>
        <div class="row" style="justify-content:center;margin-top:18px;flex-wrap:nowrap">
          <button class="btn" style="flex:1" @click="resolveConfirm(false)">취소</button>
          <button class="btn btn-danger" style="flex:1" @click="resolveConfirm(true)">{{ confirmModal.confirmLabel }}</button>
        </div>
      </div>
    </div>

    <footer class="appfoot no-print">Made by 정우쌤 <span class="heart">🙏🏻</span> Inspired by HSBT</footer>

    <div class="toast-container no-print">
      <div v-for="t in toasts" :key="t.id" class="toast" :class="t.type">{{ t.message }}</div>
    </div>
  </div>
  `,
};
